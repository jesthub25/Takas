trade:
  # Takas için maksimum mesafe (blok). 0 = sınırsız
  max-distance: 15
  # Farklı dünyalardaki oyuncular takas yapabilsin mi?
  allow-cross-world: false
  # İki taraf onayladıktan sonra geri sayım (saniye)
  countdown-seconds: 5
  # Takas isteğinin geçerlilik süresi (saniye)
  request-timeout-seconds: 30

# Renk kodu: &  |  Yer tutucular: {player} {distance} {seconds}
messages:
  prefix: "&8[&6Takas&8] "

  only-players: "&cBu komutu sadece oyuncular kullanabilir."
  no-permission: "&cBu komutu kullanma izniniz yok."
  usage-trade: "&eKullanım: &f/trade <oyuncu> &7| &f/trade toggle"
  usage-reply: "&eKullanım: &f/tradereply accept|deny"
  reloaded: "&aConfig yeniden yüklendi."

  player-not-found: "&cOyuncu bulunamadı: &e{player}"
  self-trade: "&cKendine takas isteği gönderemezsin."
  too-far: "&cOyuncu çok uzakta! Maksimum mesafe: &e{distance} &cblok."
  different-world: "&cOyuncu farklı bir dünyada."
  player-disabled: "&c{player} takas isteklerini kapatmış."
  already-trading-self: "&cZaten bir takas yapıyorsun."
  already-trading-other: "&c{player} şu an başka biriyle takas yapıyor."
  already-pending: "&cBu oyuncuya zaten bekleyen bir istek var."

  request-sent: "&a{player} &eadlı oyuncuya takas isteği gönderildi."
  request-header: "  &6{player} &esana takas isteği gönderdi!"
  request-accept-button: "&a&l[ ✔ Kabul Et ]"
  request-accept-hover: "&aTakas isteğini kabul et"
  request-deny-button: "&c&l[ ✘ Reddet ]"
