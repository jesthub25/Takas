name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven package
        run: mvn -B clean package

      - uses: actions/upload-artifact@v4
        with:
          name: TradePlugin
          path: target/TradePlugin-*.jar

      # v* etiketi pushlanınca JAR ile otomatik GitHub Release oluşturur
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/TradePlugin-*.jar
          generate_release_notes: true
